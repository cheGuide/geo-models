##############################################################################
#  Структура на хосте (Linux-сервер):
#
#  ~/models/                          ← эту папку копируешь целиком
#  ├── docker-compose.yml
#  ├── GAEA/
#  │   ├── Dockerfile
#  │   ├── src/, inference/, ...
#  │   └── models/
#  │       ├── Qwen2.5-VL-7B-Instruct/   (~15 GB)
#  │       └── GAEA/                      (LoRA)
#  ├── kopernik/
#  │   ├── *.py, .env
#  │   └── models/
#  │       ├── resnet50_streetview_imagenet1k.pth
#  │       └── resnet50_streetview_imagenet1k_regional.pth
#  ├── Revisit-Anything/
#  │   ├── *.py, sam/, VLAD-BuFF/, ...
#  │   └── models/
#  │       ├── segment-anything/sam_vit_h_4b8939.pth
#  │       ├── DnV2_NV/last.ckpt
#  │       └── dino_salad.ckpt
#  ├── data/
#  │   └── ttk_10k_full/
#  │       ├── images/          (~16k фотографий)
#  │       └── dataset_metadata.json
#  └── finetune_output/         (результаты обучения)
#
#  Дообучение GAEA в контейнере: docker compose --profile finetune run --rm gaea-finetune
#  Локальные pip-обновления — только в GAEA/gaea_env (см. GAEA/GAEA_LINUX_FINETUNE.md).
#
#  GeoAgent (LoRA на TTK):
#    Linux/macOS: docker compose build geoagent-train
#    Windows (ждёт Docker Desktop, при необходимости запускает его):
#      .\scripts\geoagent-docker.ps1 build
#      или: scripts\geoagent-docker.cmd build
#    docker compose --profile geoagent run geoagent-prepare
#    docker compose --profile geoagent run geoagent-train
#    Постоянный контейнер: docker compose --profile geoagent up -d geoagent-shell
#  Нужны: GeoAgent/checkpoints/ghost233lism/GeoAgent (веса), data/ttk_10k_full
##############################################################################

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Образ 1: geo-base (GAEA + Kopernik)
  #   nvcr.io/nvidia/pytorch:24.10-py3 — PyTorch 2.5, CUDA 12.6, Python 3.10
  # ═══════════════════════════════════════════════════════════════════════════

  # Gradio: src/serve/app.py по умолчанию подставляет SYSTEM_PROMPT TTK (только lat, lon).
  gaea:
    build: ./GAEA
    image: geo-base
    ports:
      - "7860:7860"
    volumes:
      - ./GAEA:/workspace/gaea
      - ./data:/workspace/data
      - ./finetune_output:/workspace/finetune_output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/gaea
      # Инференс TTK (final_lora): base → merge GAEA → TTK; см. GAEA/src/utils.py
      - GAEA_LORA_PATH=/workspace/gaea/models/GAEA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python gaea/src/serve/app.py
      --model-path /workspace/gaea/models/GAEA
      --model-base /workspace/gaea/models/Qwen2.5-VL-7B-Instruct

  # Дообучение GAEA (LoRA на TTK). Образ geo-base, те же тома, что у gaea.
  # Запуск: docker compose --profile finetune run --rm gaea-finetune
  gaea-finetune:
    image: geo-base
    build: ./GAEA
    runtime: nvidia
    volumes:
      - ./GAEA:/workspace/gaea
      - ./data:/workspace/data
      - ./finetune_output:/workspace/finetune_output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/gaea
      - BASE_MODEL_PATH=/workspace/gaea/models/Qwen2.5-VL-7B-Instruct
      - GAEA_LORA_PATH=/workspace/gaea/models/GAEA
      - TRAIN_DATA_PATH=/workspace/gaea/data/ttk_train.json
      - TEST_DATA_PATH=/workspace/gaea/data/ttk_test.json
      - OUTPUT_DIR=/workspace/finetune_output/gaea_ttk
      - TTK_DATASET_ROOT=/workspace/data/ttk_10k_full
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/gaea
    command: python finetune_ttk.py
    profiles: ["finetune"]

  kopernik:
    image: geo-base
    ports:
      - "8501:8501"
    volumes:
      - ./kopernik:/workspace/kopernik
      - ./data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/kopernik
      - DATASET_PATH=/workspace/data/ttk_10k_full
      - CKPT=/workspace/kopernik/models/resnet50_streetview_imagenet1k.pth
      - CKPT_REG=/workspace/kopernik/models/resnet50_streetview_imagenet1k_regional.pth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/kopernik
    command: >
      streamlit run gui.py
      --server.port 8501
      --server.headless true

  kopernik-api:
    image: geo-base
    ports:
      - "8000:8000"
    volumes:
      - ./kopernik:/workspace/kopernik
      - ./data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/kopernik
      - DATASET_PATH=/workspace/data/ttk_10k_full
      - CKPT=/workspace/kopernik/models/resnet50_streetview_imagenet1k.pth
      - CKPT_REG=/workspace/kopernik/models/resnet50_streetview_imagenet1k_regional.pth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/kopernik
    command: uvicorn server:app --host 0.0.0.0 --port 8000

  # ═══════════════════════════════════════════════════════════════════════════
  # Образ 2: segvlad (Revisit-Anything)
  #   nvcr.io/nvidia/pytorch:24.01-py3 — PyTorch 2.2, CUDA 12.3, Python 3.10
  # ═══════════════════════════════════════════════════════════════════════════

  revisit:
    build: ./Revisit-Anything
    image: segvlad
    volumes:
      - ./Revisit-Anything:/workspace/revisit
      - ./data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/revisit
      - TORCH_HOME=/workspace/revisit/.torch_cache
      - WORKDIR_DATA=/workspace/data
      - MODEL_DIR=/workspace/revisit/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/revisit
    command: >
      python place_rec_SAM_DINO.py
      --dataset 17places
      --method DINO

  # ═══════════════════════════════════════════════════════════════════════════
  # GeoAgent — дообучение LoRA на TTK (сервер с NVIDIA GPU)
  # Образ: GeoAgent/Dockerfile
  # На хосте нужны: ./GeoAgent (код), ./data/ttk_10k_full, веса GeoAgent в ./GeoAgent/checkpoints/ghost233lism/GeoAgent
  #
  # Windows: если data/ttk_10k_full — симлинк, «голый» compose не увидит файлы в Linux-VM;
  #   используйте scripts/geoagent-docker.ps1 prepare|train (добавляет явный -v на реальный путь).
  # Linux: scripts/geoagent-docker.sh prepare|train — то же.
  #
  # 1) Подготовить JSON (один раз или после смены датасета):
  #    docker compose --profile geoagent run geoagent-prepare
  #    или: .\scripts\geoagent-docker.ps1 prepare
  # 2) Обучение:
  #    docker compose --profile geoagent run geoagent-train
  #    или: .\scripts\geoagent-docker.ps1 train
  # Постоянный контейнер (в списке Docker Desktop, restart: unless-stopped):
  #    docker compose --profile geoagent up -d geoagent-shell
  #    docker exec -it geoagent-shell bash
  # Логи и чекпоинты: ./GeoAgent/train_output/ (том на хосте)
  # ═══════════════════════════════════════════════════════════════════════════

  # Долгоживущий процесс: тома как у обучения; команды внутри — docker exec.
  geoagent-shell:
    build:
      context: ./GeoAgent
      dockerfile: Dockerfile
    image: geoagent-train
    container_name: geoagent-shell
    runtime: nvidia
    volumes:
      - ./GeoAgent:/workspace/GeoAgent
      - ./data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/GeoAgent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/GeoAgent
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    restart: unless-stopped
    profiles: ["geoagent"]

  geoagent-prepare:
    build:
      context: ./GeoAgent
      dockerfile: Dockerfile
    image: geoagent-train
    volumes:
      - ./GeoAgent:/workspace/GeoAgent
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace/GeoAgent
    working_dir: /workspace/GeoAgent
    command: >
      python train/prepare_ttk_geoagent_data.py
      --dataset_path /workspace/data/ttk_10k_full
      --output_dir /workspace/GeoAgent/data/ttk_geoagent_sft
    profiles: ["geoagent"]

  geoagent-train:
    build:
      context: ./GeoAgent
      dockerfile: Dockerfile
    image: geoagent-train
    runtime: nvidia
    volumes:
      - ./GeoAgent:/workspace/GeoAgent
      - ./data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/workspace/GeoAgent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /workspace/GeoAgent
    command: >
      python train/train_ttk_lora.py
      --model_path /workspace/GeoAgent/checkpoints/ghost233lism/GeoAgent
      --train_json /workspace/GeoAgent/data/ttk_geoagent_sft/train.json
      --val_json /workspace/GeoAgent/data/ttk_geoagent_sft/val.json
      --output_dir /workspace/GeoAgent/train_output/ttk_lora
    profiles: ["geoagent"]
